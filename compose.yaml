services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/gym_occupancy
      DB_USERNAME: gym_occupancy
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OCCUPANCY_API_URL: ${OCCUPANCY_API_URL:?Set OCCUPANCY_API_URL in .env}
      OCCUPANCY_SOURCE_ZONE: ${OCCUPANCY_SOURCE_ZONE:-America/New_York}
      OCCUPANCY_POLL_DELAY: ${OCCUPANCY_POLL_DELAY:-5m}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_occupancy
      POSTGRES_USER: gym_occupancy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_occupancy -d gym_occupancy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
