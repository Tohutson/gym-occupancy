spring.application.name=Gym Occupancy Tracker
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gym_occupancy}
spring.datasource.username=${DB_USERNAME:gym_occupancy}
spring.datasource.password=${DB_PASSWORD:gym_occupancy}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

occupancy.api-url=${OCCUPANCY_API_URL:}
occupancy.source-zone=${OCCUPANCY_SOURCE_ZONE:America/New_York}
occupancy.connect-timeout=${OCCUPANCY_CONNECT_TIMEOUT:5s}
occupancy.read-timeout=${OCCUPANCY_READ_TIMEOUT:10s}
occupancy.retry-attempts=${OCCUPANCY_RETRY_ATTEMPTS:3}
occupancy.retry-delay=${OCCUPANCY_RETRY_DELAY:1s}
occupancy.retry-max-delay=${OCCUPANCY_RETRY_MAX_DELAY:10s}
occupancy.poll-delay=${OCCUPANCY_POLL_DELAY:10m}
occupancy.initial-delay=${OCCUPANCY_INITIAL_DELAY:5s}
occupancy.retention=${OCCUPANCY_RETENTION:730d}
occupancy.baseline-lookback=${OCCUPANCY_BASELINE_LOOKBACK:56d}
occupancy.baseline-minimum-days=${OCCUPANCY_BASELINE_MINIMUM_DAYS:3}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
