spring.application.name=Gym Occupancy Tracker
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gym_occupancy}
spring.datasource.username=${DB_USERNAME:gym_occupancy}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

occupancy.api-url=${OCCUPANCY_API_URL:}
occupancy.source-zone=${OCCUPANCY_SOURCE_ZONE:America/New_York}
occupancy.connect-timeout=${OCCUPANCY_CONNECT_TIMEOUT:5s}
occupancy.read-timeout=${OCCUPANCY_READ_TIMEOUT:10s}
occupancy.poll-delay=${OCCUPANCY_POLL_DELAY:5m}
occupancy.initial-delay=${OCCUPANCY_INITIAL_DELAY:30s}
occupancy.retention=${OCCUPANCY_RETENTION:730d}
occupancy.baseline-lookback=${OCCUPANCY_BASELINE_LOOKBACK:56d}
occupancy.baseline-minimum-days=${OCCUPANCY_BASELINE_MINIMUM_DAYS:3}
occupancy.stale-after=${OCCUPANCY_STALE_AFTER:30m}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,occupancyData
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
